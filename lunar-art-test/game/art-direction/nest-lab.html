<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Nest lab</title>
<style>
html,body{margin:0;height:100%;background:#030305;overflow:hidden;font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8d2c8}
canvas{display:block;width:100vw;height:100vh}
.bar{position:fixed;left:12px;top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:2}
.bar b{letter-spacing:.14em;margin-right:8px;color:#ff8a6a}
button{font:inherit;color:#d8d2c8;background:rgba(20,18,22,.85);border:1px solid #3a3238;border-radius:5px;padding:5px 9px;cursor:pointer}
button.on{border-color:#ff5a3a;color:#ffd2c2}
</style>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="c"></canvas>
<div class="bar"><b>NEST</b>
<button id="light-studio" class="on">Studio</button><button id="light-lamp">Headlamp</button>
<button id="approach">Walk up to it</button><button id="burn">Flare it</button><button id="reset">Regrow</button>
<button id="specimen" class="on">Crawler beside</button></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {createNestView} from '../nest-view.js';
import {createCrawlerView} from '../crawler-view.js';
import {createAstronaut} from '../actor.js';

const $=id=>document.getElementById(id),canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(1.75,devicePixelRatio));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#0b1018');
{const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.02).texture;room.dispose();pmrem.dispose();}
const camera=new THREE.PerspectiveCamera(34,1,.05,100);camera.position.set(1.2,2.3,7.4);
const orbit=new OrbitControls(camera,canvas);orbit.target.set(0,.75,.5);orbit.enableDamping=true;orbit.maxDistance=16;

// The set: a rough rock wall (z = 0) and floor.
const rock=new THREE.MeshStandardMaterial({color:'#4a4d50',roughness:.93});
const floorGeo=new THREE.PlaneGeometry(14,10,70,50).rotateX(-Math.PI/2);{const p=floorGeo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,.03*Math.sin(p.getX(i)*2.1)*Math.cos(p.getZ(i)*1.7)-.02);floorGeo.computeVertexNormals();}
const floor=new THREE.Mesh(floorGeo,rock);floor.receiveShadow=true;floor.position.z=5;scene.add(floor);
const wallGeo=new THREE.PlaneGeometry(14,5,140,50);{const p=wallGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,-.16*Math.abs(Math.sin(x*1.3+y*.7))-.08*Math.sin(y*3.1+x*.4)-.05*Math.sin(x*5.3-y*4.1));}wallGeo.computeVertexNormals();}
const wall=new THREE.Mesh(wallGeo,rock);wall.position.set(0,2.5,-.04);wall.receiveShadow=true;scene.add(wall);

const hemi=new THREE.HemisphereLight('#b8c8e8','#1d1a22',1),key=new THREE.DirectionalLight('#fff1dc',2.4),rim=new THREE.DirectionalLight('#9fb8e0',2);
key.position.set(-3,6,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-5,right:5,top:5,bottom:-5});rim.position.set(4,3,1);
const lamp=new THREE.SpotLight('#cfe8ff',0,24,.42,.6,1.4);lamp.castShadow=true;camera.add(lamp);lamp.position.set(.3,0,0);lamp.target.position.set(0,0,-1);camera.add(lamp.target);scene.add(camera,hemi,key,rim);
function lighting(dark){scene.environmentIntensity=dark?.03:.5;hemi.intensity=dark?.03:1;key.intensity=dark?0:2.4;rim.intensity=dark?.15:2;lamp.intensity=dark?60:0;scene.background.set(dark?'#020305':'#0b1018');$('light-studio').classList.toggle('on',!dark);$('light-lamp').classList.toggle('on',dark);}
$('light-studio').onclick=()=>lighting(false);$('light-lamp').onclick=()=>lighting(true);lighting(false);

const nest=createNestView(scene,{mode:'studio'});
// For scale and style: a crawler idling to one side and an astronaut who can walk up to the nest.
const loader=new GLTFLoader();
const [crawlerGLTF,astronautGLTF]=await Promise.all([loader.loadAsync('../assets/crawler.glb'),loader.loadAsync('../assets/astronaut-v3.glb')]);
const specimenRoot=new THREE.Group();specimenRoot.position.set(2.9,0,.9);scene.add(specimenRoot);
const specimen=createCrawlerView(crawlerGLTF,specimenRoot,{mode:'studio'});
const stand={x:0,z:0,facing:-2.2,state:'idle',t:0,speed:0};
const astronaut=createAstronaut({...astronautGLTF,scene:SkeletonUtils.clone(astronautGLTF.scene)});scene.add(astronaut.root);
$('specimen').onclick=()=>{specimenRoot.visible=!specimenRoot.visible;$('specimen').classList.toggle('on',specimenRoot.visible);};

let approach=false,alert=0,walkT=0;
$('approach').onclick=()=>{approach=!approach;$('approach').classList.toggle('on',approach);};
$('burn').onclick=()=>nest.burn();$('reset').onclick=()=>nest.reset();

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();const toCamera=new THREE.Vector3();
function frame(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;
 // The astronaut stands well back, or walks up to within reach of the legs.
 const want=approach?1.9:4.6,a=astronaut.root.position;const dz=want-a.z,moving=Math.abs(dz)>.05;
 a.set(-1.4,0,a.z===0?4.6:a.z+Math.sign(dz)*Math.min(Math.abs(dz),1.6*dt));astronaut.root.rotation.y=Math.PI*.95;
 astronaut.update({animation:moving?'aimwalk':'aimidle',gun:true,speed:moving?1.6:0},dt);
 alert+=((a.z<2.6?1:0)-alert)*(1-Math.exp(-dt*2));
 orbit.update();camera.getWorldDirection(toCamera).negate();
 nest.update(dt,{alert,toCamera});
 stand.t+=dt;specimen.update(stand,dt,{player:{x:a.x-specimenRoot.position.x,z:a.z-specimenRoot.position.z}});
 renderer.render(scene,camera);requestAnimationFrame(frame);
}
window.nestLab={scene,nest,lighting,camera,orbit,renderer};
requestAnimationFrame(frame);
</script></body></html>
