<style>

.panel h3{margin:2px 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7f8ea3;font-weight:600}
.clips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:10px}.clips button{padding:5px 4px}
.row{display:flex;gap:6px;align-items:center;margin:6px 0}.row label{display:flex;gap:5px;align-items:center;cursor:pointer}
input[type=range]{width:100%;accent-color:#8a70ff}
.note{color:#8796ab;font-size:12px;margin:6px 0 0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:#aab6c6}.keys kbd{font:11px ui-monospace,monospace;background:#1b2636;border:1px solid #2e3d52;border-radius:4px;padding:1px 5px;color:#e4e9f1;justify-self:start}
.readout{font:11px/1.5 ui-monospace,monospace;color:#9fb0c4;white-space:pre;margin-top:8px;background:#0a0f17;border-radius:6px;padding:6px}
.hud{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:#0d131dcc;border:1px solid #243041;border-radius:10px;padding:8px 14px}
.meter{width:150px;height:8px;background:#1a2230;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#d9473a,#f0a24a);width:100%;transition:width .15s}
.hud span{font:12px ui-monospace,monospace;color:#c8d2df}

.prompt .meter{width:260px;height:10px;margin:10px auto 0}.prompt .meter i{background:linear-gradient(90deg,#8a70ff,#d7c9ff)}

[hidden]{display:none!important}

<div class="panel" id="specimen-panel">
 <h3>Clips</h3><div class="clips" id="clips"></div>

function sound(kind,distance=4){
 if(!audio)return;const t=audio.currentTime,out=audio.createGain();out.gain.value=Math.max(.08,1-distance/22);out.connect(audio.destination);
 const env=(node,peak,attack,length)=>{const g=audio.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+length);node.connect(g);g.connect(out);return g;};
 if(kind==='shriek'){for(const [f,detune] of [[620,0],[655,30],[1240,-20]]){const o=audio.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.6,t+.55);o.frequency.exponentialRampToValueAtTime(f*1.7,t+.9);o.detune.value=detune;
   const trem=audio.createOscillator(),tg=audio.createGain();trem.frequency.value=38;tg.gain.value=300;trem.connect(tg);tg.connect(o.detune);trem.start(t);trem.stop(t+1);env(o,.09,.08,.95);o.start(t);o.stop(t+1);}
  const n=noise(1),bp=audio.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=2;n.connect(bp);env(bp,.25,.05,.9);n.start(t);}
 if(kind==='lunge'){const n=noise(.5),lp=audio.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(400,t);lp.frequency.exponentialRampToValueAtTime(2400,t+.35);n.connect(lp);env(lp,.5,.05,.45);n.start(t);}
 if(kind==='shot'){const n=noise(.3),lp=audio.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;n.connect(lp);env(lp,.9,.002,.25);n.start(t);const o=audio.createOscillator();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);env(o,.6,.002,.18);o.start(t);o.stop(t+.2);}
 if(kind==='hit'||kind==='slash'){const o=audio.createOscillator();o.type='square';o.frequency.setValueAtTime(kind==='hit'?220:120,t);o.frequency.exponentialRampToValueAtTime(60,t+.2);env(o,.25,.005,.22);o.start(t);o.stop(t+.25);const n=noise(.2);env(n,.3,.002,.15);n.start(t);}
 if(kind==='chitter'){for(let i=0;i<5;i++){const o=audio.createOscillator();o.type='square';o.frequency.value=1800+Math.random()*900;const g=audio.createGain();g.gain.setValueAtTime(0,t+i*.045);g.gain.linearRampToValueAtTime(.05,t+i*.045+.005);g.gain.linearRampToValueAtTime(0,t+i*.045+.025);o.connect(g);g.connect(out);o.start(t+i*.045);o.stop(t+i*.045+.03);}}
 if(kind==='death'){const o=audio.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(90,t+1.2);env(o,.12,.02,1.3);o.start(t);o.stop(t+1.4);}
}

// Input. The pointer is projected onto the cave floor to aim lamp and pistol.
const ray=new THREE.Raycaster(),groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hitPoint=new THREE.Vector3(),ndc=new THREE.Vector2();
canvas.addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerdown',e=>{if(mode!=='hunt'||watch||e.button!==0)return;canvas.focus();shoot();});
addEventListener('keydown',e=>{
 if(mode!=='hunt')return;const k=e.key.toLowerCase();if(k===' ')e.preventDefault();if(e.repeat)return;
 if(k==='f'){setWatch(!watch);return;}
 if(watch)return;keys.add(k);
 if(k==='e'&&crawler.state==='grab'&&struggle(crawler))release();
 if(k===' '&&crawler.state!=='grab'){const m=moveIntent(),still=!m.x&&!m.z;startDodge(dodge,still?Math.sin(state.player.facing):m.x,still?Math.cos(state.player.facing):m.z);}
 if(k==='r')reloadGun(gun);
 if(k==='c')craftAmmoNow();
 if(k==='x'&&metal>=2){metal-=2;flareStock+=3;}
 if(k==='q')throwFlare(aim.x,aim.z);
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function craftAmmoNow(){const items={metal};if(craftAmmo(gun,items))metal=items.metal;}
const screenForward=new THREE.Vector3(),screenRight=new THREE.Vector3();
function moveIntent(){
 const x=(keys.has('d')?1:0)-(keys.has('a')?1:0),y=(keys.has('w')?1:0)-(keys.has('s')?1:0);if(!x&&!y)return {x:0,z:0};
 screenForward.set(-1,0,-1).normalize().applyAxisAngle(THREE.Object3D.DEFAULT_UP,-angle);screenRight.set(1,0,-1).normalize().applyAxisAngle(THREE.Object3D.DEFAULT_UP,-angle);
 const vx=screenForward.x*y+screenRight.x*x,vz=screenForward.z*y+screenRight.z*x,l=Math.hypot(vx,vz);return {x:vx/l,z:vz/l};
}
function updateAim(){
 const r=canvas.getBoundingClientRect();ndc.set((mouse.x-r.left)/r.width*2-1,-(mouse.y-r.top)/r.height*2+1);ray.setFromCamera(ndc,huntCam);
 if(ray.ray.intersectPlane(groundPlane,hitPoint)){view.root.worldToLocal(hitPoint);aim.x=hitPoint.x-state.player.x;aim.z=hitPoint.z-state.player.z;aimMarker.position.set(hitPoint.x,.05,hitPoint.z);}
}
function shoot(target){
 if(!fireGun(gun))return;const p=state.player,from={x:p.x+Math.sin(p.facing)*.5,z:p.z+Math.cos(p.facing)*.5};
 const dir=target??{x:Math.sin(p.facing),z:Math.cos(p.facing)},end=shotEnd(cave,from,dir,[crawler]);
 tracerGeo.attributes.position.setXYZ(0,from.x,1.1,from.z);tracerGeo.attributes.position.setXYZ(1,end.x,.9,end.z);tracerGeo.attributes.position.needsUpdate=true;tracerT=.08;
 flash.position.set(from.x,1.15,from.z);flash.material.opacity=1;flicker=Math.max(flicker,.05);sound('shot',0);
 if(end.hit){const result=hurtCrawler(end.hit.crawler,PISTOL.damage,rand);
  for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3;ichor.spawn(end.x,.8,end.z,Math.cos(a)*s-dir.x*2,1+Math.random()*2.5,Math.sin(a)*s-dir.z*2,.35+Math.random()*.35);}sound(result.killed?'death':'hit',end.hit.distance);if(result.released)release();}
}
function throwFlare(dx,dz){
 if(!flareStock||state.flares.length>=FLARE.limit)return;const p=state.player,l=Math.hypot(dx,dz)||1,reach=Math.min(FLARE.range,l);
 let d=0;while(d<reach&&walkable(cave,p.x+dx/l*(d+.3),p.z+dz/l*(d+.3),.1))d+=.25;
 state.flares.push({cave:CAVE_ID,zone:ZONE,x:p.x+dx/l*d,z:p.z+dz/l*d,t:0});flareStock--;
}
function release(){prompt(null);}
function hurt(amount){health=Math.max(0,health-amount);hurtPause=HEALTH.regenDelay;hurtFlash=Math.min(1,hurtFlash+amount/14);}
function prompt(text){$('prompt').style.display=text?'block':'none';if(text)$('prompt-text').textContent=text;}

// The dummy: patrols between rooms with the lamp ahead, turns on what it hears, and sometimes rolls clear of a lunge.
let dummyPlan={room:0,reaction:0,dodged:false,struggleT:0};
function dummyIntent(dt){
 const p=state.player,c=crawler,d=Math.hypot(c.x-p.x,c.z-p.z);
 if(c.state==='shriek'){dummyPlan.reaction+=dt;if(!dummyPlan.dodged&&dummyPlan.reaction>CRAWLER.shriekTime-.15){dummyPlan.dodged=true;if(Math.random()<.5)startDodge(dodge,Math.cos(p.facing),-Math.sin(p.facing));}return {x:0,z:0,face:Math.atan2(c.x-p.x,c.z-p.z)};}
 dummyPlan.reaction=0;dummyPlan.dodged=false;
 if(c.state==='grab'){dummyPlan.struggleT-=dt;if(dummyPlan.struggleT<=0){dummyPlan.struggleT=.16+Math.random()*.12;if(struggle(c))release();}return {x:0,z:0};}
 if(c.state!=='dead'&&d<6&&Math.random()<dt*.2)return {x:0,z:0,face:Math.atan2(c.x-p.x,c.z-p.z)};
 const route=[cave.rooms[0],...cave.rooms.slice(1,6)];const r=route[patrol%route.length],tx=r.x*2,tz=r.z*2;
 if(Math.hypot(tx-p.x,tz-p.z)<2.5)patrol++;
 const field=new Map([[caveKey(r.x,r.z),0]]),q=[caveKey(r.x,r.z)];for(let i=0;i<q.length&&i<900;i++){const [x,z]=q[i].split(',').map(Number);for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=caveKey(x+a,z+b);if(cave.cells.has(k)&&!field.has(k)){field.set(k,field.get(q[i])+1);q.push(k);}}}
 const cx=Math.round(p.x/2),cz=Math.round(p.z/2);let best=null,bd=field.get(caveKey(cx,cz))??1e9;
 for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const v=field.get(caveKey(cx+a,cz+b));if(v!=null&&v<bd){bd=v;best=[cx+a,cz+b];}}
 const gx=best?best[0]*2:tx,gz=best?best[1]*2:tz,vx=gx-p.x,vz=gz-p.z,l=Math.hypot(vx,vz)||1;return {x:vx/l*.6,z:vz/l*.6};
}

function updateHunt(dt){
 const p=state.player;
 if(!watch)updateAim();
 // Lamp: shorted by a slash, stuttering back to life.
 lampShort=Math.max(0,lampShort-dt);const lampOn=lampShort<=0;
 const dash=stepDodge(dodge,dt);
 if(blackout>0){blackout-=dt;if(blackout<=0)reset();}
 let intent={x:0,z:0},grabbed=crawler.state==='grab';
 if(blackout<=0&&!grabbed){
  if(watch){intent=dummyIntent(dt);if(intent.face!=null)p.facing=intent.face;else if(intent.x||intent.z)p.facing=Math.atan2(intent.x,intent.z);}
  else{intent=moveIntent();if(Math.hypot(aim.x,aim.z)>.3)p.facing=Math.atan2(aim.x,aim.z);}
 }else if(grabbed&&watch)dummyIntent(dt);
 const speed=6.5*(watch?.75:1);
 const mx=dash.rolling?dash.x:intent.x*speed*dt,mz=dash.rolling?dash.z:intent.z*speed*dt;
 if(walkable(cave,p.x+mx,p.z,PLAYER_RADIUS))p.x+=mx;if(walkable(cave,p.x,p.z+mz,PLAYER_RADIUS))p.z+=mz;
 // Flares burn down.
 state.flares.forEach(f=>f.t+=dt);state.flares=state.flares.filter(f=>f.t<FLARE.life);
 const env={cave,player:{x:p.x,z:p.z,facing:p.facing,lamp:lampOn,invulnerable:dash.invulnerable},flares:state.flares.map(f=>({x:f.x,z:f.z,r:FLARE.radius}))};
 const wasState=crawler.state;
 for(const e of stepCrawler(crawler,env,dt,rand)){
  const d=Math.hypot(crawler.x-p.x,crawler.z-p.z);
  if(e.type==='shriek'){sound('shriek',d);flicker=Math.max(flicker,.9);}
  if(e.type==='lunge')sound('lunge',d);
  if(e.type==='grab'){hurt(e.damage);sound('slash',0);shakeT=.3;}
  if(e.type==='slash'){hurt(e.damage);lampShort=e.short;sound('slash',0);shakeT=.35;}
  if(e.type==='drag'){if(walkable(cave,p.x+e.dx,p.z+e.dz,PLAYER_RADIUS)){p.x+=e.dx;p.z+=e.dz;}}
  if(e.type==='hurt')hurt(e.damage);
  if(e.type==='release')release();
 }
 if(crawler.state==='dead'&&wasState!=='dead')sound('death',4);
 if(crawler.state==='grab')prompt(watch?'GRABBED':'GRABBED — MASH E');else if($('prompt').style.display==='block'&&crawler.state!=='grab')prompt(null);
 if(crawler.state==='dead'&&crawler.t>6){const r=farRoom();spawnAt(r.x*2,r.z*2);}
 if((crawler.state==='stalk'||crawler.state==='close')&&Math.random()<dt*.18)sound('chitter',Math.hypot(crawler.x-p.x,crawler.z-p.z));
 // Suit.
 hurtPause=Math.max(0,hurtPause-dt);if(!hurtPause&&health>0)health=Math.min(HEALTH.max,health+HEALTH.regen*dt);
 if(health<=0&&blackout<=0){blackout=2.5;prompt('BLACKED OUT');crawler.state='flee';crawler.t=0;}
 stepGun(gun,dt);
 if(watch&&crawler.state!=='dead'&&blackout<=0){const d=Math.hypot(crawler.x-p.x,crawler.z-p.z),ahead=(Math.sin(p.facing)*(crawler.x-p.x)+Math.cos(p.facing)*(crawler.z-p.z))/(d||1);
  if(d<11&&ahead>.97&&exposure(env,crawler.x,crawler.z)>.1&&Math.random()<dt*.9)shoot();
  if(!gun.mag&&!gun.reloading&&!gun.reserve&&metal>0)craftAmmoNow();}
 // Pose the actors.
 player.position.set(p.x,0,p.z);player.rotation.y=p.facing;
 const moving=Math.hypot(mx,mz)/dt;
 if(dash.rolling){const k=1-dodge.t/DODGE.time;roll.rotation.set(k*Math.PI*2,0,0);player.rotation.y=Math.atan2(dodge.dx,dodge.dz);}else roll.rotation.set(0,0,0);
 actor.update({animation:dash.rolling?'jump':moving>.5?'run':'idle',speed:moving},dt);
 beast.root.position.set(crawler.x,0,crawler.z);beast.root.rotation.y=crawler.facing;
 const anim=crawler.anim;
 if(anim!==beast.name){beast.play(anim,{fade:anim==='lunge'?.04:.14,at:anim==='lunge'?.3:0});}
 const a=beast.action;if(a){a.timeScale=anim==='stalk'?Math.max(.3,crawler.speed/CRAWLER.speed.stalk):anim==='skitter'?Math.max(.6,crawler.speed/6):anim==='shriek'?1.2:1;}
 beast.mixer.update(dt);
 // Seams: a slow heartbeat from afar, dark when it is close and stalking, blazing when it commits.
 const s=crawler.state,near=Math.hypot(crawler.x-p.x,crawler.z-p.z);
 let want=.12+.75*heartbeat(clock*1.1);
 if(s==='dead')want=Math.max(0,1-crawler.t/1.5)*.4;
 else if(s==='shriek')want=1.5*(Math.sin(clock*40)>-.3?1:.4);
 else if(s==='lunge'||s==='grab'||s==='slash')want=1.2;
 else if(s==='recoil'||s==='flee'||s==='hit')want=Math.random()<.5?.9:.1;
 else if((s==='stalk'||s==='close')&&near<9)want=.025;
 seamLevel+=(want-seamLevel)*(1-Math.exp(-dt*(want>seamLevel?18:4)));
 beast.seams.forEach(m=>m.color.setRGB(.62*seamLevel,.32*seamLevel,seamLevel));
 mawGlow.value=s==='shriek'?.9:s==='lunge'||s==='grab'?.7:s==='slash'?.5:0;
 // It carries the dark with it, and smokes ink as it moves.
 const alive=s!=='dead'?1:Math.max(0,1-crawler.t/2);
 const wispRate=(s==='flee'||s==='lunge'?60:s==='shriek'?40:14)*alive;
 for(wispClock+=dt*wispRate;wispClock>1;wispClock--)ink.spawn(crawler.x+(Math.random()-.5)*.9,.35+Math.random()*.6,crawler.z+(Math.random()-.5)*1.2,(Math.random()-.5)*.3,.25+Math.random()*.35,(Math.random()-.5)*.3,1.2+Math.random()*1.2);
 // Death: the husk slumps, then crumbles to ash and violet embers.
 if(s==='dead'){const k=Math.max(0,Math.min(1,(crawler.t-1.2)/1.6));beast.root.position.y=-.7*k*k;beast.root.scale.set(1,1-.6*k,1);
  if(k>0&&k<1)for(let i=0;i<3;i++){const x=crawler.x+(Math.random()-.5)*1.6,z=crawler.z+(Math.random()-.5)*2;ash.spawn(x,.3+Math.random()*.5,z,(Math.random()-.5)*.6,.4+Math.random()*.6,(Math.random()-.5)*.6,1.5+Math.random());if(Math.random()<.5)embers.spawn(x,.4,z,(Math.random()-.5)*.4,.8+Math.random()*1.2,(Math.random()-.5)*.4,1.4+Math.random()*1.4);}
 }else beast.root.scale.set(1,1,1);
 ink.update(dt,0,1.5);ichor.update(dt,9,.5);ash.update(dt,-.1,2);embers.update(dt,-.3,1);
 // The cave's own sight follows the astronaut; our flicker rides on top of its own.
 view.update(state,dt);
 flicker=Math.max(0,flicker-dt);
 if(!lampOn){view.sight.uFlicker.value=lampShort<.8&&Math.random()<.4?.6:.02;}
 else if(flicker>0)view.sight.uFlicker.value=Math.random()<.4?.1+Math.random()*.3:1;
 // The lamp falters as it closes; the dark pool around it swallows the rock.
 view.sight.uVoid.value.set(crawler.x,crawler.z,.85*alive);
 view.sight.uFlicker.value*=1-.5*alive*Math.max(0,Math.min(1,1-(near-2)/6));
 headlamp.intensity=lampOn?145*view.sight.uFlicker.value:0;suitFill.intensity=lampOn?9:2;
 tracerT=Math.max(0,tracerT-dt);tracer.material.opacity=tracerT/.08;flash.material.opacity=Math.max(0,flash.material.opacity-dt*14);
 aimMarker.visible=!watch;
 hurtFlash=Math.max(0,hurtFlash-dt*1.5);$('hurt').style.opacity=String(Math.min(.85,hurtFlash));
 // Camera: the game's isometric view, shaken by hits.
 shakeT=Math.max(0,shakeT-dt);const world=player.getWorldPosition(new THREE.Vector3()),shake=shakeT*.5;
 world.x+=(Math.random()-.5)*shake;world.z+=(Math.random()-.5)*shake;world.y+=1.05;
 huntCam.position.set(world.x+104,world.y+136,world.z+104);huntCam.lookAt(world);
 // HUD.
 $('health').style.width=`${health}%`;$('ammo').textContent=`AMMO ${gun.mag}/${gun.reserve}${gun.reloading?' ↻':''}`;$('flares').textContent=`FLARES ${flareStock}`;$('metal').textContent=`METAL ${metal}`;
 $('escape').style.width=`${Math.min(1,crawler.escape)*100}%`;$('escape-meter').style.display=crawler.state==='grab'?'block':'none';
 $('readout').textContent=`state    ${crawler.state}\nanim     ${crawler.anim}\nhp       ${crawler.hp}/${CRAWLER.hp}\npatience ${Math.max(0,crawler.patience).toFixed(1)}s\ndistance ${Math.hypot(crawler.x-p.x,crawler.z-p.z).toFixed(1)} m\nlit      ${exposure(env,crawler.x,crawler.z).toFixed(2)}\nlamp     ${lampOn?'on':'SHORTED '+lampShort.toFixed(1)}`;
 renderer.render(hunt,huntCam);
}

// ---------------- Shell ----------------
let mode=params.get('mode')==='hunt'?'hunt':'specimen',clock=0;
function setMode(m){mode=m;$('tab-specimen').classList.toggle('on',m==='specimen');$('tab-hunt').classList.toggle('on',m==='hunt');$('specimen-panel').hidden=m!=='specimen';$('hunt-panel').hidden=m!=='hunt';$('hud').hidden=m!=='hunt';orbit.enabled=m==='specimen';if(m!=='hunt')prompt(null);resize();canvas.focus();}
$('tab-specimen').onclick=()=>setMode('specimen');$('tab-hunt').onclick=()=>setMode('hunt');
function resize(){
 const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);studioCam.aspect=w/h;studioCam.updateProjectionMatrix();
 if(!resize.framed){resize.framed=true;const reach=7.5/Math.min(1,w/h*1.1);studioCam.position.set(.55*reach,.34*reach,.76*reach);}
 const viewHeight=24,aspect=w/h;Object.assign(huntCam,{left:-viewHeight*aspect/2,right:viewHeight*aspect/2,top:viewHeight/2,bottom:-viewHeight/2});huntCam.updateProjectionMatrix();
}
addEventListener('resize',resize);setMode(mode);
window.lab={studioCam,orbit,state,get crawler(){return crawler;},cave,renderer,setMode,spawnBehind,reset,setWatch,beast,specimen,selectClip};
let last=performance.now();
function frame(now){const dt=window.lab.paused?0:Math.min((now-last)/1000,.1);last=now;clock+=dt;if(mode==='hunt')updateHunt(dt);else updateStudio(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
