<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centipede lab</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06090f;font:13px/1.35 ui-sans-serif,system-ui,-apple-system,sans-serif;color:#d6dde8;user-select:none}
canvas#lab{position:fixed;inset:0;width:100%;height:100%;outline:none}
.panel{position:fixed;top:12px;left:12px;width:250px;max-height:calc(100% - 24px);overflow:auto;background:#0d131dcc;border:1px solid #243041;border-radius:10px;padding:10px;backdrop-filter:blur(6px)}
.panel h2{margin:0 0 8px;font-size:12px;letter-spacing:.14em;color:#b9a7ff}
.panel h3{margin:10px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7f8ea3;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.grid.two{grid-template-columns:1fr 1fr}
button{font:inherit;color:#d6dde8;background:#172130;border:1px solid #2a384c;border-radius:7px;padding:5px 6px;cursor:pointer}
button:hover{background:#1f2c40}button.on{background:#3a2a6e;border-color:#7a62e0;color:#fff}
.row{display:flex;gap:6px;align-items:center;margin:5px 0}.row label{display:flex;gap:5px;align-items:center;cursor:pointer}
.slider{display:grid;grid-template-columns:76px 1fr 34px;gap:6px;align-items:center;margin:4px 0;font-size:12px;color:#aab6c6}
input[type=range]{width:100%;accent-color:#8a70ff}
.note{color:#8796ab;font-size:12px;margin:6px 0 0}
.readout{font:11px/1.5 ui-monospace,monospace;color:#9fb0c4;white-space:pre;margin-top:8px;background:#0a0f17;border-radius:6px;padding:6px}
</style>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="lab" tabindex="0"></canvas>
<div class="panel">
 <h2>CENTIPEDE LAB</h2>
 <h3>Style</h3><div class="grid" id="styles"></div><p class="note" id="style-note"></p>
 <h3>Tuning</h3>
 <div class="slider"><span>Freakiness</span><input type="range" id="freak" min="0" max="1.6" step=".05"><span id="freak-v"></span></div>
 <div class="slider"><span>Speed</span><input type="range" id="pace" min=".4" max="2" step=".05"><span id="pace-v"></span></div>
 <div class="slider"><span>Segments</span><input type="range" id="segments" min="8" max="44" step="1"><span id="segments-v"></span></div>
 <h3>Movement</h3><div class="grid" id="modes"></div>
 <div class="row"><label><input type="checkbox" id="auto" checked>Burrow by itself</label></div>
 <h3>Do it now</h3><div class="grid"><button id="burrow">Burrow</button><button id="rear">Rear + slam</button><button id="shudder">Shudder</button></div>
 <h3>View</h3>
 <div class="grid"><button data-speed=".25">¼×</button><button data-speed=".5">½×</button><button data-speed="1" class="on">1×</button></div>
 <div class="row"><button id="light-studio" class="on">Studio</button><button id="light-night">Night, headlamp</button></div>
 <div class="row"><label><input type="checkbox" id="follow" checked>Camera follows</label><label><input type="checkbox" id="astro" checked>Astronaut</label></div>
 <p class="note">Drag to orbit, scroll to zoom. The astronaut is 1.8 m tall.</p>
 <div class="readout" id="readout"></div>
</div>
<script type="module">
// Isolated centipede review. Never reads or writes colony saves.
// ?style=needle|millipede|plated &mode=wander|chase|circle &freak=0..1
import * as THREE from 'three';

{const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.02).texture;scene.environmentIntensity=.5;room.dispose();pmrem.dispose();}

key.position.set(-6,12,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-16,right:16,top:16,bottom:-16,far:60});rim.position.set(6,5,-8);

for(let r=2;r<=16;r+=2){const ring=new THREE.Mesh(new THREE.RingGeometry(r-.01,r+.01,128).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#4a5466',transparent:true,opacity:.5}));ring.position.y=.003;scene.add(ring);}
const astronaut=createAstronaut({...astronautGLTF,scene:SkeletonUtils.clone(astronautGLTF.scene)});scene.add(astronaut.root);astronaut.root.position.set(0,0,0);
const headlamp=new THREE.SpotLight('#cfe8ff',0,26,.5,.6,1.4);headlamp.position.set(0,1.55,.25);headlamp.castShadow=true;astronaut.root.add(headlamp);const lampTarget=new THREE.Object3D();lampTarget.position.set(0,.2,8);astronaut.root.add(lampTarget);headlamp.target=lampTarget;

// Burrowing: craters that fade, dirt thrown up, and a trail of cracking ground over the tunnel.
const craterGeo=new THREE.CircleGeometry(1,28).rotateX(-Math.PI/2);{const p=craterGeo.attributes.position;for(let i=1;i<p.count;i++){const a=Math.atan2(p.getZ(i),p.getX(i)),r=.8+.12*Math.sin(a*5+1)+.08*Math.sin(a*9);p.setX(i,Math.cos(a)*r);p.setZ(i,Math.sin(a)*r);}}

let nextCrater=0;

const DIRT=500,dirtPos=new Float32Array(DIRT*3),dirtVel=new Float32Array(DIRT*3),dirtLife=new Float32Array(DIRT),dirtAlpha=new Float32Array(DIRT);
const dirtGeo=new THREE.BufferGeometry();dirtGeo.setAttribute('position',new THREE.BufferAttribute(dirtPos,3));dirtGeo.setAttribute('aAlpha',new THREE.BufferAttribute(dirtAlpha,1));
const dirt=new THREE.Points(dirtGeo,new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uColor:{value:new THREE.Color('#77736b')},uSize:{value:14*Math.min(2,devicePixelRatio||1)}},
 vertexShader:'uniform float uSize;attribute float aAlpha;varying float vA;void main(){vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=uSize*(.5+aAlpha)*8./-mv.z;}',
 fragmentShader:'uniform vec3 uColor;varying float vA;void main(){float a=smoothstep(.5,.15,length(gl_PointCoord-.5))*vA;if(a<.01)discard;gl_FragColor=vec4(uColor,a);}'}));dirt.frustumCulled=false;scene.add(dirt);
let nextDirt=0;
function kick(x,z,n,power=1,spread=.6){for(let i=0;i<n;i++){const k=nextDirt;nextDirt=(nextDirt+1)%DIRT;const a=Math.random()*Math.PI*2,r=Math.random()*spread,s=(1+Math.random()*3)*power;

let shake=0;

// The specimen.
let style=CENTIPEDE_STYLES[params.get('style')]?params.get('style'):'needle',mode=['wander','chase','circle'].includes(params.get('mode'))?params.get('mode'):'chase';

let body,view;
function build(){

 const at=body?{x:body.x,z:body.z,f:body.facing}:{x:-7,z:-5,f:.8};
 body=createCentipede(at.x,at.z,{segments,spacing:S.spacing,gait:S.gait,facing:at.f});body.pace=pace;
 view=createCentipedeView(crawlerGLTF,scene,{style,segments,freak});
 styleButtons.forEach((b,k)=>b.classList.toggle('on',k===style));$('style-note').textContent=S.note;
 $('segments').value=segments;$('segments-v').textContent=segments;
 const q=new URLSearchParams(location.search);q.set('style',style);q.set('mode',mode);q.set('freak',freak);history.replaceState(null,'',location.pathname+'?'+q);
}
const styleButtons=new Map();
for(const [id,S] of Object.entries(CENTIPEDE_STYLES)){const b=document.createElement('button');b.textContent=S.name.split(' ').at(-1)[0].toUpperCase()+S.name.split(' ').at(-1).slice(1);b.title=S.name;b.onclick=()=>{style=id;segments=S.segments;build();};$('styles').append(b);styleButtons.set(id,b);}
const modeButtons=new Map();
for(const [id,label] of [['wander','Wander'],['chase','Hunt you'],['circle','Circle']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{mode=id;modeButtons.forEach((x,k)=>x.classList.toggle('on',k===id));build.url?.();};$('modes').append(b);modeButtons.set(id,b);}
modeButtons.get(mode).classList.add('on');
const slider=(id,get,set,fmt=v=>v.toFixed(2))=>{const el=$(id);el.value=get();$(id+'-v').textContent=fmt(get());el.oninput=()=>{set(Number(el.value));$(id+'-v').textContent=fmt(Number(el.value));};};
slider('freak',()=>freak,v=>freak=v);slider('pace',()=>pace,v=>{pace=v;body.pace=v;});

build();

function setLight(night){scene.environmentIntensity=night?.02:.5;hemi.intensity=night?.04:1;key.intensity=night?0:2.4;rim.intensity=night?.12:1.8;headlamp.intensity=night?160:0;scene.background.set(night?'#020305':'#0b1018');$('light-studio').classList.toggle('on',!night);$('light-night').classList.toggle('on',night);}
$('light-studio').onclick=()=>setLight(false);$('light-night').onclick=()=>setLight(true);
$('astro').onchange=e=>astronaut.root.visible=e.target.checked;
const near=()=>mode==='chase'?{x:astronaut.root.position.x,z:astronaut.root.position.z}:null;
$('burrow').onclick=()=>burrow(body,popSpot(body,near()));
$('rear').onclick=()=>rear(body);
$('shudder').onclick=()=>{const f=freak;freak=1;setTimeout(()=>freak=f,900);};

// Behaviour: where it heads, and when it goes under on its own.
