<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caves • art review</title><link rel="stylesheet" href="../game.css"><style>html,body{margin:0;height:100%;overflow:hidden;background:#090f1a}canvas#game{position:fixed;inset:0;width:100%;height:100%;outline:none}</style><script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script></head><body><canvas id="game" tabindex="0"></canvas><script type="module">
// Isolated cave review. Never reads or writes colony saves.

 if(walk&&local<16){local+=Math.min(dt,.1)*5;place();if(now>3000){window.longestFrame=Math.max(window.longestFrame,dt*1000);(window.frameLog??=[]).push([+local.toFixed(1),Math.round(dt*1000)]);}}

</script></body></html>
